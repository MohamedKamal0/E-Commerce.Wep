<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your Crochet Atelier profile and shipping address.">
  <title>My Profile — Crochet Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/responsive.css" rel="stylesheet">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
</head>
<body>
  <div id="navbar-root"></div>
  <div id="toast-container"></div>

  <header class="page-header">
    <div class="container">
      <h1>My Profile</h1>
      <p>Manage your account and shipping details</p>
    </div>
  </header>

  <main class="section pt-0">
    <div class="container">
      <div class="profile-layout">
        <aside class="profile-sidebar reveal">
          <div class="profile-avatar" id="profileAvatar">U</div>
          <h5 id="profileName">Loading...</h5>
          <p class="text-muted small" id="profileEmail"></p>
          <ul class="profile-nav">
            <li><a href="/pages/profile.html" class="active"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="/pages/orders.html"><i class="fas fa-box"></i> Orders</a></li>
            <li><a href="/pages/add-product.html"><i class="fas fa-plus-circle"></i> Add Product</a></li>
            <li><a href="/pages/cart.html"><i class="fas fa-shopping-bag"></i> Cart</a></li>
          </ul>
        </aside>

        <div class="profile-content reveal">
          <!-- Account Info -->
          <div class="mb-5">
            <h4 class="mb-4">Account Information</h4>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted small">Display Name</label>
                <p class="fw-semibold" id="infoDisplayName">—</p>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small">Email</label>
                <p class="fw-semibold" id="infoEmail">—</p>
              </div>
            </div>
          </div>

          <!-- Address Form -->
          <div>
            <h4 class="mb-4">Shipping Address</h4>
            <form id="addressForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                    <label for="firstName">First Name</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                    <label for="lastName">Last Name</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="street" placeholder="Street" required>
                    <label for="street">Street Address</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="city" placeholder="City" required>
                    <label for="city">City</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="country" placeholder="Country">
                    <label for="country">Country</label>
                  </div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary mt-4">
                <i class="fas fa-save me-2"></i>Update Address
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
