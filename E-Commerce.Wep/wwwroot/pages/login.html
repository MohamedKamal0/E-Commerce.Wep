<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Crochet Atelier account to manage orders and checkout.">
  <title>Login — Crochet Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/responsive.css" rel="stylesheet">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
</head>
<body>
  <div id="navbar-root"></div>
  <div id="toast-container"></div>

  <main class="auth-page">
    <div class="auth-card reveal">
      <div class="text-center mb-4">
        <img src="/images/logo.svg" alt="Crochet Atelier" width="56" class="mb-3">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue your shopping journey</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-floating">
          <input type="email" class="form-control" id="email" placeholder="Email" required autocomplete="email">
          <label for="email">Email Address</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="password" placeholder="Password" required autocomplete="current-password">
          <label for="password">Password</label>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="small text-muted">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">Sign In</button>
      </form>

      <p class="auth-divider">Don't have an account? <a href="/pages/register.html">Create one</a></p>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
