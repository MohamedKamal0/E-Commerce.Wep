<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete your order — secure checkout for handmade crochet bags.">
  <title>Checkout — Crochet Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/responsive.css" rel="stylesheet">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
</head>
<body>
  <div id="navbar-root"></div>
  <div id="toast-container"></div>

  <header class="page-header">
    <div class="container">
      <h1>Checkout</h1>
      <p>Complete your order with secure payment</p>
    </div>
  </header>

  <main class="section pt-0">
    <div class="container">
      <div class="checkout-layout">
        <div class="checkout-main">
          <form id="checkoutForm" novalidate>
            <!-- Shipping Address -->
            <div class="checkout-form-section reveal">
              <h4><i class="fas fa-map-marker-alt me-2 text-primary-custom"></i>Shipping Address</h4>
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="firstName" placeholder="First Name" required>
                    <label for="firstName">First Name</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                    <label for="lastName">Last Name</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="street" placeholder="Street Address" required>
                    <label for="street">Street Address</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="city" placeholder="City" required>
                    <label for="city">City</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Delivery Method -->
            <div class="checkout-form-section reveal">
              <h4><i class="fas fa-truck me-2 text-primary-custom"></i>Delivery Method</h4>
              <div class="delivery-options" id="deliveryMethods">
                <p class="text-muted">Loading delivery options...</p>
              </div>
            </div>

            <!-- Payment -->
            <div class="checkout-form-section reveal">
              <h4><i class="fas fa-credit-card me-2 text-primary-custom"></i>Payment</h4>
              <p class="text-muted small mb-3">Secure payment powered by Stripe</p>
              <div id="payment-element"></div>
              <button type="submit" class="btn btn-primary btn-lg w-100 mt-4" id="payBtn">
                <i class="fas fa-lock me-2"></i>Pay Now
              </button>
            </div>
          </form>
        </div>

        <!-- Order Summary -->
        <aside class="cart-summary reveal">
          <h4>Order Summary</h4>
          <div id="checkoutItems"></div>
          <div class="summary-row"><span>Subtotal</span><span id="checkoutSubtotal">$0.00</span></div>
          <div class="summary-row"><span>Shipping</span><span id="checkoutShipping">—</span></div>
          <div class="summary-row total"><span>Total</span><span id="checkoutTotal">$0.00</span></div>
        </aside>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
