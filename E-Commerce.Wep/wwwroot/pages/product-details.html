<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View product details for our handmade crochet bags. Premium artisan craftsmanship.">
  <title>Product Details — Crochet Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="/css/responsive.css" rel="stylesheet">

<body>
  <div id="navbar-root"></div>

  <section class="section bg-secondary-section" id="relatedSection">

      </div>
      <div class="products-grid" id="relatedProducts"></div>
    </div>

  <!-- Recently Viewed -->
  <section class="section" id="recentSection">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-label">Recently Viewed</span>
        <h2 class="section-title">Continue Exploring</h2>
      </div>
      <div class="products-grid" id="recentlyViewed"></div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/product-details.js"></script>
