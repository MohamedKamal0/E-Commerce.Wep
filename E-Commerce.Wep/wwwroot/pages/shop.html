<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop our collection of premium handmade crochet bags. Filter by brand, type, and discover your perfect artisan piece.">
  <title>Shop — Crochet Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/responsive.css" rel="stylesheet">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
</head>
<body>
  <div id="navbar-root"></div>
  <div id="toast-container"></div>

  <header class="page-header">
    <div class="container">
      <h1>Shop Collection</h1>
      <p>Discover handcrafted crochet bags made with love and artistry</p>
    </div>
  </header>

  <main class="section pt-0">
    <div class="container">
      <div class="shop-layout">
        <aside class="shop-sidebar reveal">
          <div class="filter-group">
            <h6><i class="fas fa-search me-2"></i>Search</h6>
            <input type="search" id="searchInput" placeholder="Search bags..." aria-label="Search products">
          </div>
          <div class="filter-group">
            <h6><i class="fas fa-tag me-2"></i>Brand</h6>
            <select id="brandFilter" aria-label="Filter by brand">
              <option value="">All Brands</option>
            </select>
          </div>
          <div class="filter-group">
            <h6><i class="fas fa-layer-group me-2"></i>Type</h6>
            <select id="typeFilter" aria-label="Filter by type">
              <option value="">All Types</option>
            </select>
          </div>
          <button type="button" class="btn btn-outline w-100" id="clearFilters">
            <i class="fas fa-times me-2"></i>Clear Filters
          </button>
        </aside>

        <div class="shop-main">
          <div class="shop-toolbar reveal">
            <p class="shop-results-count" id="resultsCount">Loading products...</p>
            <div class="shop-sort">
              <select id="sortFilter" aria-label="Sort products">
                <option value="0">Default</option>
                <option value="1">Name A–Z</option>
                <option value="2">Name Z–A</option>
                <option value="3">Price: Low to High</option>
                <option value="4">Price: High to Low</option>
              </select>
            </div>
          </div>

          <div class="products-grid" id="productsGrid"></div>
          <div id="pagination"></div>
        </div>
      </div>

      <!-- Wishlist Section -->
      <section class="section" id="wishlistSection" style="display:none;">
        <div class="section-header">
          <span class="section-label">Saved Favorites</span>
          <h2 class="section-title">Your Wishlist</h2>
        </div>
        <div class="products-grid wishlist-grid"></div>
      </section>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pages/shop.js"></script>
</body>
</html>
